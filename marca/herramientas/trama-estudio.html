<meta name="description" content="Generador de tramas por capas de Nave Café: imágenes, símbolo y formas convertidas en puntos, con recetas reutilizables y exportación SVG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: mesa de trabajo de tres columnas — capas · lienzo · propiedades. Interfaz en Espacio para que el lienzo sea lo único con color. */
:root{
  color-scheme:dark;
  --crema:#FFF5EE; --niebla:#D7E1E2; --espacio:#012436; --tueste:#210A05; --ignicion:#E55C41; --ambar:#EFA441; --acero:#798E91; --petroleo:#005A88; --senal:#0067DE;
  --ui:#00131D; --ui-2:#011B29; --ui-3:#06293C; --line:rgba(255,245,238,.1); --line-2:rgba(255,245,238,.2);
  --tx:#FFF5EE; --tx-2:rgba(255,245,238,.62); --tx-3:rgba(255,245,238,.4);
  --sans:"Standerd","Inter Tight","Helvetica Neue",Arial,sans-serif;
  --mono:"Lenia Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ui);color:var(--tx);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--senal);outline-offset:2px}
.app{display:grid;grid-template-columns:270px minmax(0,1fr) 320px;grid-template-rows:52px minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--ui)}
header .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
header .brand svg{width:22px;height:22px}
header .sp{flex:1}
.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-2)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.btn:hover{background:rgba(255,245,238,.06)}
.btn.pri{background:var(--ignicion);border-color:var(--ignicion);color:var(--crema)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 9px;font-size:10px}
aside{background:var(--ui-2);overflow:auto;min-height:0}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:11px;font-family:var(--mono);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ambar)}
.layers{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:2px}
.layers li{display:grid;grid-template-columns:18px 26px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.layers li:hover{background:rgba(255,245,238,.04)}
.layers li.sel{background:var(--ui-3);border-color:var(--line-2)}
.layers .sw{width:26px;height:26px;border-radius:4px;border:1px solid var(--line-2);display:grid;place-items:center}
.layers .sw i{width:10px;height:10px;border-radius:50%}
.layers .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.layers .nm small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3)}
.ic{all:unset;cursor:pointer;width:18px;height:18px;display:grid;place-items:center;color:var(--tx-2);border-radius:4px}
.ic:hover{color:var(--tx);background:rgba(255,245,238,.08)}
.ic svg{width:14px;height:14px}
.adds{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.adds .btn{justify-content:center}
.stage{position:relative;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;background:
  linear-gradient(rgba(255,245,238,.03) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(255,245,238,.03) 1px,transparent 1px) 0 0/24px 24px,#000C14}
.stage canvas{display:block;box-shadow:0 30px 60px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,245,238,.06)}
.stage .meta{position:absolute;left:16px;bottom:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--tx-3);text-transform:uppercase}
.drop{position:absolute;inset:16px;border:2px dashed var(--ambar);border-radius:10px;display:none;place-items:center;background:rgba(1,36,54,.75);font-size:18px;font-weight:600;pointer-events:none}
.stage.over .drop{display:grid}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;align-items:center;gap:8px;margin:8px 0}
.row.two{grid-template-columns:96px minmax(0,1fr)}
.row label{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-2)}
.row output{font-family:var(--mono);font-size:11px;text-align:right;color:var(--tx);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line-2)}
input[type=range]::-moz-range-track{height:2px;background:var(--line-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--crema);margin-top:-6px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--crema);border:0}
select,input[type=text],input[type=number]{width:100%;background:var(--ui);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;font-size:13px}
input[type=number]{font-family:var(--mono);font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{padding:5px 8px;border-radius:999px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx-2)}
.seg button[aria-pressed=true]{background:var(--crema);color:var(--espacio);border-color:var(--crema)}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);cursor:pointer;padding:0}
.pal button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ui-2),0 0 0 3.5px var(--crema)}
.pal input[type=color]{width:24px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx-2);margin:8px 0;cursor:pointer}
.hint{font-size:12.5px;color:var(--tx-3);margin:6px 0 0}
.thumb{width:100%;aspect-ratio:16/10;border:1px dashed var(--line-2);border-radius:6px;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--tx-3);font-size:12.5px;text-align:center;padding:8px;background:var(--ui)}
.thumb img{width:100%;height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--crema);color:var(--espacio);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.recipes{display:grid;gap:6px}
.recipes button{text-align:left;padding:9px 10px;border-radius:6px;border:1px solid var(--line);background:var(--ui);cursor:pointer}
.recipes button:hover{border-color:var(--line-2)}
.recipes b{display:block;font-size:13px;font-weight:600}
.recipes span{font-size:11.5px;color:var(--tx-3)}
textarea#manual{width:100%;height:120px;background:var(--ui);border:1px solid var(--line-2);border-radius:6px;font-family:var(--mono);font-size:10.5px;padding:8px}
.empty{color:var(--tx-3);font-size:13px;padding:12px 16px}
@media (max-width:980px){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;height:auto}
  header{flex-wrap:wrap;padding-block:10px;height:auto}
  .stage{min-height:60vh;order:-1}
  aside.left,aside.right{border:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Descarga iniciada: ' + name);
}
const stamp = () => `nave-trama-${doc.fmt}-${new Date().toISOString().slice(0, 10)}`;
$('#b-svg').onclick = () => download(stamp() + '.svg', new Blob([buildSVG()], { type: 'image/svg+xml' }));
$('#b-png').onclick = () => {
  const c = document.createElement('canvas'), k = Math.min(2, 8000 / Math.max(doc.w, doc.h)); c.width = Math.round(doc.w * k); c.height = Math.round(doc.h * k);
  render(c.getContext('2d'), k); c.toBlob(b => b ? download(stamp() + '.png', b) : toast('No se pudo generar el PNG.'), 'image/png');
};
$('#b-copy').onclick = () => {
  const svg = buildSVG(), kb = Math.round(svg.length / 1024);
  const manual = () => { showManual(svg); toast('Copia manual: selecciona el código del panel derecho.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(svg).then(() => toast(`SVG copiado (${kb} KB). Pégalo en Figma con Ctrl/Cmd + V.`), manual); else manual();
};
function showManual(svg) { const p = $('#props'); p.insertAdjacentHTML('afterbegin', `<div class="sec"><h3>SVG</h3><textarea id="manual" readonly></textarea></div>`); const t = $('#manual'); t.value = svg; t.focus(); t.select(); }

/* ——— Recetas ——— */
function recipe(withImages) {
  const r = { tipo: 'nave-trama', version: 1, doc: { fmt: doc.fmt, w: doc.w, h: doc.h, bg: doc.bg }, capas: doc.layers.map(l => ({ ...l })) };
  if (withImages) { r.imagenes = {}; for (const l of doc.layers) if (l.image && IMAGES.has(l.image)) r.imagenes[l.image] = { nombre: IMAGES.get(l.image).name, src: IMAGES.get(l.image).src }; }
  return r;
}
async function loadRecipe(r) {
  if (!r || r.tipo !== 'nave-trama') throw new Error('No es una receta de Nave.');
  if (r.imagenes) for (const [id, im] of Object.entries(r.imagenes)) await addImage(im.src, im.nombre, id);
  Object.assign(doc, r.doc); doc.layers = r.capas.map(l => ({ ...defaults(l.kind), ...l })); doc.sel = doc.layers.length ? doc.layers[doc.layers.length - 1].id : null;
  fieldStore.clear(); syncDoc(); ui();
}
$('#b-save').onclick = () => {
  const hasImg = doc.layers.some(l => l.image && IMAGES.has(l.image));
  download(stamp() + '.receta.json', new Blob([JSON.stringify(recipe(hasImg), null, 1)], { type: 'application/json' }));
};
$('#b-open').onclick = () => $('#f-recipe').click();
$('#f-recipe').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; try { await loadRecipe(JSON.parse(await f.text())); toast('Receta cargada: ' + f.name); } catch (err) { toast('No se pudo abrir: ' + err.message); } e.target.value = ''; };
const HOUSE = [
  { n: 'Sello', d: 'Símbolo en puntos sobre Espacio', r: { doc: { fmt: 'cuadrado', w: 1080, h: 1080, bg: 'espacio' }, capas: [{ kind: 'simbolo', name: 'Órbita', color: 'senal', opacity: 60, sep: 25, max: 25 }, { kind: 'marca', name: 'Logotipo', w: 46, colW: 'crema', colC: 'ambar' }] } },
  { n: 'Soporte de la casa', d: 'Retícula, margen 2M y marcas según formato', r: { doc: { fmt: 'pantalla', w: 1920, h: 1080, bg: 'tueste' }, capas: [{ kind: 'soporte', name: 'Soporte', colLine: 'crema', colMark: 'ambar', lineOp: 14 }, { kind: 'marca', name: 'Logotipo', w: 26, colW: 'crema', colC: 'ambar' }] } },
  { n: 'Densidad que asciende', d: 'Campo que se concentra arriba, texto abajo', r: { doc: { fmt: 'post', w: 1080, h: 1350, bg: 'crema' }, capas: [{ kind: 'forma', shape: 'campo', name: 'Presión', color: 'ignicion', mode: 'ambos', sep: 30, max: 46, fade: 100, fadeDir: 'abajo', cut: 8 }] } },
  { n: 'Planeta', d: 'Esfera iluminada con anillo', r: { doc: { fmt: 'cuadrado', w: 1080, h: 1080, bg: 'espacio' }, capas: [{ kind: 'forma', shape: 'planeta', name: 'Planeta', color: 'crema', sep: 16, max: 80, scale: .8 }] } },
  { n: 'Escotilla', d: 'Toroide de puntos', r: { doc: { fmt: 'cuadrado', w: 1080, h: 1080, bg: 'espacio' }, capas: [{ kind: 'forma', shape: 'toroide', name: 'Escotilla', color: 'ignicion', sep: 12, max: 90, scale: .9 }] } },
  { n: 'Volcán · altitud', d: 'Para empaque de café', r: { doc: { fmt: 'post', w: 1080, h: 1350, bg: 'espacio' }, capas: [{ kind: 'forma', shape: 'volcan', name: 'Volcán', color: 'ambar', sep: 18, max: 70, scale: .9, oy: 8 }] } },
  { n: 'Presión (lente)', d: 'Retícula desplazada', r: { doc: { fmt: 'pantalla', w: 1920, h: 1080, bg: 'crema' }, capas: [{ kind: 'forma', shape: 'campo', name: 'Campo', color: 'espacio', sep: 22, max: 26, lens: 80, lx: .6, ly: .5 }] } },
];
$('#recipes').innerHTML = HOUSE.map((h, i) => `<button type="button" data-r="${i}"><b>${h.n}</b><span>${h.d}</span></button>`).join('') + `<button type="button" data-r="foto"><b>Foto a dos tintas</b><span>Sube una foto: Espacio sobre Ámbar</span></button>`;
$('#recipes').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.r === 'foto') { pendingRecipe = 'foto'; $('#f-img').click(); return; }
  const h = HOUSE[+b.dataset.r]; IMAGES.size; loadRecipe({ tipo: 'nave-trama', ...JSON.parse(JSON.stringify(h.r)) }); toast('Receta: ' + h.n);
};
let pendingRecipe = null;

/* ——— Imágenes ——— */
function addImage(src, name, id) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { id = id || 'img-' + uid(); IMAGES.set(id, { img, src, name }); res(id); }; img.onerror = () => rej(new Error('Imagen no válida')); img.src = src; });
}
function readFile(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); }); }
async function addImageLayer(file) {
  const src = await readFile(file);
  // reduce a 1600 px para mantener recetas livianas
  const big = await addImage(src, file.name), im = IMAGES.get(big).img, k = Math.min(1, 1600 / Math.max(im.width, im.height));
  if (k < 1) { const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); IMAGES.delete(big); await addImage(c.toDataURL('image/jpeg', .86), file.name, big); }
  if (pendingRecipe === 'foto') { pendingRecipe = null; doc.bg = 'ambar'; doc.layers = []; }
  const l = { ...defaults('imagen'), image: big, name: file.name.replace(/\.[^.]+$/, '').slice(0, 28) };
  if (doc.bg === 'ambar') { l.color = 'espacio'; l.tone = 'sombras'; }
  else if (['crema', 'niebla', 'ambar', 'blanco'].includes(doc.bg)) { l.color = 'espacio'; }
  doc.layers.push(l); doc.sel = l.id; ui();
}
$('#f-img').onchange = async (e) => { const f = e.target.files[0]; if (f) await addImageLayer(f).catch(err => toast(err.message)); e.target.value = ''; };
stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('over'); });
stage.addEventListener('dragleave', () => stage.classList.remove('over'));
stage.addEventListener('drop', async (e) => { e.preventDefault(); stage.classList.remove('over'); for (const f of e.dataTransfer.files) if (f.type.startsWith('image/')) await addImageLayer(f).catch(err => toast(err.message)); });
window.addEventListener('paste', async (e) => { for (const it of e.clipboardData?.items || []) if (it.type.startsWith('image/')) { await addImageLayer(it.getAsFile()); toast('Imagen pegada como capa'); } });

/* ——— Interfaz ——— */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
function palette(id, cur, keys, onPick) {
  return `<div class="pal" data-pal="${id}">${keys.map(k => `<button type="button" style="background:${C[k]}" title="${NAMES[k]}" aria-label="${NAMES[k]}" aria-pressed="${cur === k}" data-v="${k}"></button>`).join('')}</div>`;
}
const BRAND = ['crema', 'niebla', 'espacio', 'tueste', 'ignicion', 'ambar', 'acero', 'petroleo', 'senal'];
function syncDoc() {
  $('#d-fmt').value = doc.fmt; $('#d-custom').hidden = doc.fmt !== 'libre'; $('#d-w').value = doc.w; $('#d-h').value = doc.h; $('#d-grid').checked = doc.grid;
  $('#d-bg').outerHTML = palette('bg', doc.bg, [...BRAND, 'blanco']).replace('class="pal"', 'class="pal" id="d-bg"');
  $('#d-bg').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; doc.bg = b.dataset.v; syncDoc(); redraw(); };
}
$('#d-fmt').innerHTML = FORMATS.map(([k, n]) => `<option value="${k}">${n}</option>`).join('');
$('#d-fmt').onchange = (e) => { const f = FORMATS.find(x => x[0] === e.target.value); doc.fmt = f[0]; if (f[2]) { doc.w = f[2]; doc.h = f[3]; } fieldStore.clear(); syncDoc(); ui(); };
['#d-w', '#d-h'].forEach(s => $(s).onchange = () => { doc.w = clamp(+$('#d-w').value || 1080, 200, 6000); doc.h = clamp(+$('#d-h').value || 1080, 200, 6000); fieldStore.clear(); redraw(); });
$('#d-grid').onchange = (e) => { doc.grid = e.target.checked; redraw(); };
document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
  const k = b.dataset.add; if (k === 'imagen') { $('#f-img').click(); return; }
  const l = defaults(k); if (k === 'marca') { l.colW = ['crema', 'niebla', 'ambar', 'blanco'].includes(doc.bg) ? 'espacio' : 'crema'; l.colC = doc.bg === 'ignicion' ? 'tueste' : (l.colW === 'espacio' ? 'ignicion' : 'ambar'); }
  if (k !== 'marca' && ['crema', 'niebla', 'blanco'].includes(doc.bg) && l.color === 'crema') l.color = 'espacio';
  if (k === 'soporte') { l.colLine = ['crema', 'niebla', 'ambar', 'blanco'].includes(doc.bg) ? 'espacio' : 'crema'; doc.layers.unshift(l); doc.sel = l.id; ui(); return; }
  doc.layers.push(l); doc.sel = l.id; ui();
});

function layerList() {
  const ul = $('#layers');
  if (!doc.layers.length) { ul.innerHTML = '<li class="empty" style="display:block;cursor:default">Sin capas. Agrega una imagen, el símbolo o una forma.</li>'; return; }
  ul.innerHTML = doc.layers.slice().reverse().map(l => {
    const col = l.kind === 'marca' ? C[l.colW] : l.kind === 'soporte' ? C[l.colMark] : (C[l.color] || l.color);
    return `<li class="${l.id === doc.sel ? 'sel' : ''}" data-id="${l.id}"><button class="ic" data-act="vis" aria-label="${l.visible ? 'Ocultar' : 'Mostrar'} capa"><svg><use href="#i-${l.visible ? 'eye' : 'off'}"/></svg></button><span class="sw" style="background:${C[doc.bg]}"><i style="background:${col}"></i></span><span class="nm">${esc(l.name)}<small>${{ imagen: 'Imagen', simbolo: 'Símbolo', forma: 'Forma · ' + l.shape, marca: 'Logotipo', soporte: 'Soporte · ' + doc.fmt }[l.kind]}</small></span><span style="display:flex;gap:2px"><button class="ic" data-act="up" aria-label="Subir"><svg><use href="#i-up"/></svg></button><button class="ic" data-act="dn" aria-label="Bajar"><svg><use href="#i-dn"/></svg></button><button class="ic" data-act="dup" aria-label="Duplicar"><svg><use href="#i-dup"/></svg></button><button class="ic" data-act="del" aria-label="Eliminar"><svg><use href="#i-x"/></svg></button></span></li>`;
  }).join('');
}
$('#layers').onclick = (e) => {
  const li = e.target.closest('li[data-id]'); if (!li) return; const id = li.dataset.id, i = doc.layers.findIndex(l => l.id === id), l = doc.layers[i];
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'vis') l.visible = !l.visible;
  else if (act === 'up' && i < doc.layers.length - 1) [doc.layers[i], doc.layers[i + 1]] = [doc.layers[i + 1], doc.layers[i]];
  else if (act === 'dn' && i > 0) [doc.layers[i], doc.layers[i - 1]] = [doc.layers[i - 1], doc.layers[i]];
  else if (act === 'dup') { const c = { ...l, id: uid(), name: l.name + ' copia' }; doc.layers.splice(i + 1, 0, c); doc.sel = c.id; }
  else if (act === 'del') { doc.layers.splice(i, 1); if (doc.sel === id) doc.sel = doc.layers.length ? doc.layers[doc.layers.length - 1].id : null; }
  else doc.sel = id;
  ui();
};

const R = (key, label, min, max, step = 1, unit = '') => { const l = L(); return `<div class="row"><label for="p-${key}">${label}</label><input id="p-${key}" data-k="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${l[key]}"><output>${l[key]}${unit}</output></div>`; };
const SEG = (key, label, opts) => { const l = L(); return `<div class="row two"><label>${label}</label><div class="seg" data-seg="${key}">${opts.map(([v, n]) => `<button type="button" data-v="${v}" aria-pressed="${l[key] === v}">${n}</button>`).join('')}</div></div>`; };
function props() {
  const l = L(), p = $('#props');
  if (!l) { p.innerHTML = '<p class="empty">Selecciona una capa para ajustar su trama. Puedes soltar una imagen sobre el lienzo o pegarla con Ctrl/Cmd + V.</p>'; return; }
  let h = `<div class="sec"><h3>Capa</h3><div class="row two"><label for="p-name">Nombre</label><input type="text" id="p-name" value="${esc(l.name)}"></div>`;
  if (l.kind === 'imagen') { const im = IMAGES.get(l.image); h += `<div class="thumb" id="p-img" role="button" tabindex="0">${im ? `<img src="${im.src}" alt="">` : 'La imagen de esta receta no está cargada. Haz clic para elegir una.'}</div>`; }
  if (l.kind === 'forma') h += SEG('shape', 'Forma', [['campo', 'Campo'], ['degradado', 'Degradado'], ['esfera', 'Esfera'], ['planeta', 'Planeta'], ['toroide', 'Toroide'], ['volcan', 'Volcán'], ['onda', 'Onda']]) + (l.shape === 'degradado' ? R('angle', 'Ángulo', 0, 359, 1, '°') : '');
  const CK = (k, t) => `<label class="check"><input type="checkbox" data-ck="${k}" ${l[k] ? 'checked' : ''}> ${t}</label>`;
  if (l.kind === 'soporte') {
    const Mv = Math.round(Math.min(doc.w, doc.h) / 20);
    h += `<p class="hint">Se calcula del formato: M = lado corto ÷ 20 = ${Mv} px, margen 2M = ${2 * Mv} px. Cambia el formato a la izquierda y el soporte se rehace.</p></div><div class="sec"><h3>Elementos</h3>` +
      CK('sGrid', 'Retícula M') + CK('sMargin', 'Margen 2M') + CK('sCrop', 'Esquinas de corte') + CK('sLabels', 'Rótulos: formato, medida, coordenadas') + CK('sOrbit', 'Órbita punteada') + CK('sSafe', 'Zona segura (historias)') + CK('sBleed', 'Línea de corte 3 mm (impresos)') +
      R('sMarks', 'Marcas +', 0, 24, 1) + `<div class="row two"><label>Semilla</label><button class="btn sm" id="p-seed" type="button">Mover marcas (${l.seed})</button></div></div>` +
      `<div class="sec"><h3>Color</h3><div class="row two"><label>Líneas</label>${palette('colLine', l.colLine, [...BRAND, 'blanco'])}</div><div class="row two"><label>Marcas</label>${palette('colMark', l.colMark, [...BRAND, 'blanco'])}</div>` + R('lineOp', 'Intensidad', 4, 60, 1, '%') + R('opacity', 'Opacidad', 0, 100, 1, '%') + '</div>';
  }
  else if (l.kind === 'marca') h += SEG('lockup', 'Versión', [['principal', 'Principal'], ['nave', 'NΛVE']]) + R('w', 'Ancho', 10, 95, 1, '%') + R('ox', 'Mover X', -50, 50, 1, '%') + R('oy', 'Mover Y', -50, 50, 1, '%') +
    `<div class="row two"><label>NΛVE</label>${palette('colW', l.colW, [...BRAND, 'blanco'])}</div>` + (l.lockup === 'principal' ? `<div class="row two"><label>Café</label>${palette('colC', l.colC, [...BRAND, 'blanco'])}</div>` : '') + R('opacity', 'Opacidad', 0, 100, 1, '%') + '</div>';
  else {
    h += R('scale', 'Escala', .2, 3, .01) + R('ox', 'Mover X', -50, 50, 1, '%') + R('oy', 'Mover Y', -50, 50, 1, '%') + '</div>';
    h += `<div class="sec"><h3>Retícula</h3>` + SEG('grid', 'Tipo', [['hex', 'Hexagonal'], ['cuadrada', 'Cuadrada'], ['ruido', 'Orgánica']]) + R('sep', 'Separación', 4, 80, 1, '') + SEG('dot', 'Punto', [['circulo', '●'], ['cuadrado', '■'], ['rombo', '◆'], ['cruz', '+'], ['anillo', '○']]) + `<p class="hint">Separación en px sobre un lado corto de 1080. La relación de la casa es 4 : 1 (tamaño máximo 25%).</p></div>`;
    h += `<div class="sec"><h3>Tono</h3>` + SEG('tone', 'Los puntos son', [['luces', 'Luces'], ['sombras', 'Sombras']]) + SEG('mode', 'El tono cambia', [['tamano', 'Tamaño'], ['presencia', 'Presencia'], ['ambos', 'Ambos']]) +
      R('min', 'Tamaño mín.', 0, 100, 1, '%') + R('max', 'Tamaño máx.', 5, 140, 1, '%') + R('contrast', 'Contraste', -40, 100, 1) + R('gamma', 'Gamma', .3, 3, .05) + R('cut', 'Umbral', 0, 60, 1, '%') + '</div>';
    h += `<div class="sec"><h3>Presión</h3>` + R('fade', 'Densidad', 0, 100, 1, '%') + SEG('fadeDir', 'Crece hacia', [['arriba', 'Abajo'], ['abajo', 'Arriba'], ['izquierda', 'Derecha'], ['derecha', 'Izquierda'], ['centro', 'Centro']]) +
      R('lens', 'Desplazam.', 0, 100, 1, '%') + (l.lens ? R('lx', 'Lente X', 0, 1, .01) + R('ly', 'Lente Y', 0, 1, .01) : '') + '</div>';
    h += `<div class="sec"><h3>Color y máscara</h3><div class="row two"><label>Color</label>${palette('color', l.color, [...BRAND, 'blanco'])}</div>` + R('opacity', 'Opacidad', 0, 100, 1, '%') +
      SEG('blend', 'Mezcla', [['normal', 'Normal'], ['multiplicar', 'Multiplicar'], ['trama', 'Trama'], ['superponer', 'Superponer']]) + SEG('mask', 'Máscara', [['ninguna', 'Ninguna'], ['simbolo', 'Símbolo'], ['circulo', 'Círculo'], ['margen', 'Margen 2M']]) +
      `<div class="row two"><label>Semilla</label><button class="btn sm" id="p-seed" type="button">Variar puntos (${l.seed})</button></div></div>`;
  }
  p.innerHTML = h;
  p.querySelectorAll('input[type=range]').forEach(inp => inp.oninput = () => { const k = inp.dataset.k; l[k] = +inp.value; inp.nextElementSibling.textContent = inp.value + (inp.dataset.k === 'angle' ? '°' : ''); if (['scale', 'ox', 'oy', 'angle'].includes(k)) fieldStore.size > 30 && fieldStore.clear(); if (k === 'lens' && (+inp.value === 0) !== !l.lens) props(); redraw(); });
  p.querySelectorAll('[data-seg]').forEach(g => g.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; l[g.dataset.seg] = b.dataset.v; props(); layerList(); redraw(); });
  p.querySelectorAll('[data-pal]').forEach(g => g.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; l[g.dataset.pal] = b.dataset.v; props(); layerList(); redraw(); });
  p.querySelectorAll('[data-ck]').forEach(c => c.onchange = () => { l[c.dataset.ck] = c.checked; redraw(); });
  $('#p-name').oninput = (e) => { l.name = e.target.value; layerList(); persist(); };
  const pi = $('#p-img'); if (pi) { const pick = () => { replacing = l.id; $('#f-img2').click(); }; pi.onclick = pick; pi.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } }; }
  const ps = $('#p-seed'); if (ps) ps.onclick = () => { l.seed = Math.floor(Math.random() * 1000); props(); redraw(); };
}
let replacing = null;
const f2i = document.createElement('input'); f2i.type = 'file'; f2i.accept = 'image/*'; f2i.id = 'f-img2'; f2i.hidden = true; document.body.appendChild(f2i);
f2i.onchange = async (e) => { const f = e.target.files[0]; if (!f || !replacing) return; const l = doc.layers.find(x => x.id === replacing); const src = await readFile(f); l.image = await addImage(src, f.name); fieldStore.clear(); replacing = null; e.target.value = ''; ui(); };
function ui() { layerList(); props(); redraw(); }

/* ——— Persistencia local (solo comodidad de este navegador) ——— */
let saveT = 0;
function persist() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem('nave-trama', JSON.stringify(recipe(false))); } catch (e) {} }, 400); }
(async () => {
  let r = null; try { r = JSON.parse(localStorage.getItem('nave-trama') || 'null'); } catch (e) {}
  if (r && r.capas && r.capas.length && !r.capas.some(c => c.kind === 'imagen')) await loadRecipe(r);
  else await loadRecipe({ tipo: 'nave-trama', ...JSON.parse(JSON.stringify(HOUSE[0].r)) });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
})();
})();
</script>
</body></html>
