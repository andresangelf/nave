<title>Nave Café</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Prototipo funcional de Nave Café: reserva de salas y pedidos de café.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Martian+Mono:wdth,wght@75..112.5,400..700&display=swap">
<style>
@font-face{font-family:"Standerd";src:url(fonts/StanderdVF.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Lenia Mono";src:url(fonts/LeniaMono-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Lenia Mono";src:url(fonts/LeniaMono-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Lenia Mono";src:url(fonts/LeniaMono-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Lenia Mono";src:url(fonts/LeniaMono-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Lenia Mono";src:url(fonts/LeniaMono-ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}
/* Layout: una sola nave. Contenedor de 1328 px, columnas 840/440, tablero de salidas como pieza central.
   Tokens tomados de la colección de variables "Nave WF" en Figma (modos Nave y Nave Oscuro). */
:root{
  --ink:#012436; --ink-muted:#4d6670; --ink-subtle:#98a9ad;
  --surface:#fffaf6; --surface-alt:#fdeee3; --surface-strong:#012436;
  --line:#e8ddd3; --accent:#e55c41; --accent-press:#cf4c33;
  --on-dark:#fff5ee; --on-dark-muted:#a7bcc2; --amber:#efa441; --niebla:#d7e1e2;
  --board:#0b0b0b; --board-tile:#171717; --board-ink:#fff5ee; --board-off:#30363a; --board-rule:rgba(255,245,238,.06);
  --dep-bg:#fbe9dc; --dep-ink:#012436; --dep-muted:#4d6670; --dep-eyebrow:#e55c41;
  --field:#ffffff; --scrim:rgba(1,36,54,.42); --shadow:0 24px 64px -24px rgba(1,36,54,.35);
  --dot-ink:1,36,54; --dot-alpha:.085;
  --f-sans:"Standerd","Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"Lenia Mono","Martian Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --pill:999px;
  --wrap:1328px; --gut:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#fff5ee; --ink-muted:#a7bcc2; --ink-subtle:#6f878d;
  --surface:#00131d; --surface-alt:#012436; --surface-strong:#17506d;
  --line:#1f4256; --board:#05090c; --board-tile:#10171c; --board-off:#26323a;
  --dep-bg:#0e2f42; --dep-ink:#fff5ee; --dep-muted:#a7bcc2; --dep-eyebrow:#efa441;
  --field:#011c2a; --scrim:rgba(0,8,12,.66); --shadow:0 24px 64px -24px rgba(0,0,0,.7);
  --dot-ink:255,245,238; --dot-alpha:.075; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#fff5ee; --ink-muted:#a7bcc2; --ink-subtle:#6f878d;
  --surface:#00131d; --surface-alt:#012436; --surface-strong:#17506d;
  --line:#1f4256; --board:#05090c; --board-tile:#10171c; --board-off:#26323a;
  --dep-bg:#0e2f42; --dep-ink:#fff5ee; --dep-muted:#a7bcc2; --dep-eyebrow:#efa441;
  --field:#011c2a; --scrim:rgba(0,8,12,.66); --shadow:0 24px 64px -24px rgba(0,0,0,.7);
  --dot-ink:255,245,238; --dot-alpha:.075; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--surface);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background-color .35s ease,color .35s ease}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Fondo: logo punteado */
#dots{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#root{position:relative;z-index:1;min-height:100%}

/* Tipografía */
.h-xl{font-weight:700;font-size:clamp(48px,7vw,88px);line-height:1;letter-spacing:-.034em;margin:0;text-wrap:balance}
.h-l{font-weight:700;font-size:clamp(32px,4vw,48px);line-height:1.05;letter-spacing:-.04em;margin:0}
.h-m{font-weight:600;font-size:24px;line-height:1.25;letter-spacing:-.04em;margin:0}
.t-row{font-weight:500;font-size:20px;line-height:1.25;letter-spacing:-.01em}
.body-l{font-size:17px;line-height:1.5}
.muted{color:var(--ink-muted)}
.subtle{color:var(--ink-subtle)}
.cap{font-size:13px;line-height:1.4}
.eyebrow{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.data{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--ink-muted)}
.num{font-variant-numeric:tabular-nums}

/* Contenedor */
.wrap{max-width:calc(var(--wrap) + 2*var(--gut));margin:0 auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
main.page{padding-block:40px 96px;min-height:70vh}
.page-head{display:grid;gap:12px;margin-bottom:40px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:var(--pill);font-weight:500;font-size:15px;line-height:1;white-space:nowrap;transition:background-color .2s,color .2s,border-color .2s,transform .12s}
.btn:active{transform:scale(.98)}
.btn-s{height:34px;padding:0 16px;font-size:13px}
.btn-primary{background:var(--accent);color:#fff5ee}
.btn-primary:hover{background:var(--accent-press)}
.btn-secondary{border:1px solid var(--ink);color:var(--ink)}
.btn-secondary:hover{background:var(--ink);color:var(--surface)}
.btn-ink{background:var(--surface-strong);color:var(--on-dark)}
.btn-inverse{background:#fff5ee;color:#012436}
.btn-inverse:hover{background:#ffffff}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link{font-size:13px;color:var(--ink-muted);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.dep .link{text-align:left;justify-self:start}
.link:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 15px;border-radius:var(--pill);border:1px solid var(--line);font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s;color:var(--ink)}
.chip:hover{border-color:var(--ink-subtle)}
.chip[aria-pressed="true"]{background:var(--surface-strong);border-color:var(--surface-strong);color:var(--on-dark)}
.chip[disabled]{opacity:.38;cursor:not-allowed;text-decoration:line-through}
.chip .extra{opacity:.8}

/* Nav: barra fija arriba en escritorio y teléfono */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:35;background:var(--surface);border-bottom:1px solid transparent;transition:border-color .2s,background-color .35s}
.appbar.scrolled{border-bottom-color:var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:36;background:var(--surface)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:84px}
.logo{display:inline-flex;color:var(--ink);height:22px}
.logo svg{height:100%;width:auto}
.logo .acc,.acc{fill:var(--accent)}
.nav-links{display:flex;gap:32px}
.nav-link{font-size:15px;color:var(--ink-muted);padding:8px 0;position:relative;text-decoration:none}
.nav-link:hover{color:var(--ink)}
.nav-link[aria-current="page"]{color:var(--ink);font-weight:600}
.nav-link[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink);border-radius:2px}
.nav-right{display:flex;gap:12px;justify-self:end;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink);border:1px solid var(--line);transition:border-color .2s}
.icon-btn:hover{border-color:var(--ink-subtle)}
.theme-ico{width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-alt);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--ink)}
.avatar.on{background:var(--surface-strong);color:var(--on-dark)}
.menu{position:absolute;right:0;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);padding:8px;min-width:220px;display:grid;z-index:30}
.menu-item{padding:10px 12px;border-radius:8px;text-align:left;font-size:14px}
.menu-item:hover{background:var(--surface-alt)}
.count{font-variant-numeric:tabular-nums}
.bump{animation:bump .45s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}

/* Barras móviles */
.topbar,.tabbar,.mbar{display:none}

/* Meta bar */
.meta{border-top:1px solid var(--line)}
.meta .wrap{display:flex;flex-wrap:wrap;gap:8px 32px;padding-block:20px 28px}
.meta span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}

/* Trama · presión */
.trama{display:grid;gap:0}
.trama i{display:block;height:8px;background-image:radial-gradient(circle at 4px 4px,var(--tc) var(--r),transparent calc(var(--r) + .6px));background-size:8px 8px;background-repeat:repeat-x}

/* Medidor de puntos */
.meter{display:flex;gap:4px}
.meter i{width:7px;height:7px;border-radius:50%;background:var(--board-off)}
.meter i.on{background:var(--board-ink);box-shadow:0 0 6px rgba(255,245,238,.35)}

/* Inicio */
.home{display:grid;grid-template-columns:minmax(0,428px) minmax(0,1fr);gap:64px;align-items:start}
.clock{font-family:var(--f-mono);font-weight:400;font-size:clamp(88px,11vw,152px);line-height:1;letter-spacing:-.04em;color:var(--amber);margin:8px 0 18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock .colon{animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.clock-sub{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--ink-muted);text-transform:uppercase}
.dep{margin-top:56px;background:var(--dep-bg);color:var(--dep-ink);border-radius:var(--r-lg);padding:32px;display:grid;gap:0;transition:background-color .35s}
.dep .eyebrow{color:var(--dep-eyebrow)}
.dep h2{font-weight:700;font-size:clamp(48px,5vw,64px);line-height:1;letter-spacing:-.045em;margin:14px 0 18px}
.dep p{margin:0 0 28px;color:var(--dep-ink);font-size:16px}
.dep .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dep .link{color:var(--dep-muted)}
.dep .trama{margin-bottom:28px}
.dep.mine{background:var(--accent);color:#fff5ee}
.dep.mine .eyebrow,.dep.mine p{color:#fff5ee}
.dep-chip{justify-self:start;margin-bottom:10px;height:30px;padding:0 12px;border-radius:var(--pill);border:1px solid var(--dep-ink);font-size:12px;display:inline-flex;align-items:center;gap:6px}
.code-box{background:#fff;color:#012436;border-radius:var(--r-sm);padding:14px 16px;margin:0 0 24px;display:grid;gap:2px}
.code-box b{font-size:24px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.code-box small{font-size:12px;color:#4d6670}

.tabs{display:flex;gap:24px;margin-bottom:24px}
.tab{font-size:15px;color:var(--ink-muted);padding:6px 0;position:relative}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--ink)}

/* Tablero de salidas */
.board{background:var(--board);color:var(--board-ink);border-radius:var(--r-lg);padding:24px 24px 22px;font-family:var(--f-mono);overflow:hidden;position:relative}
.board-head{display:flex;justify-content:space-between;gap:16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.board-head .t{color:var(--amber)}
.board-head .short{display:none}
.board-cols,.frow{display:grid;grid-template-columns:96px minmax(0,1fr) 148px 168px 104px;align-items:center;column-gap:16px}
.board-cols{font-size:11px;letter-spacing:.14em;color:#6f7d82;text-transform:uppercase;padding:14px 0 6px 0}
.board-cols span:nth-child(4){text-align:right}
.frow{min-height:93px;border-radius:6px;padding:8px 0;cursor:pointer;position:relative;background:
  linear-gradient(to bottom,transparent calc(50% - .5px),var(--board-rule) calc(50% - .5px),var(--board-rule) calc(50% + .5px),transparent calc(50% + .5px)),
  repeating-linear-gradient(90deg,transparent 0 39px,var(--board-rule) 39px 40px);transition:background-color .2s}
.frow:hover{background-color:var(--board-tile)}
.frow .code{font-weight:700;font-size:24px;letter-spacing:.06em;color:var(--amber);padding-left:24px;white-space:nowrap}
.frow .name{font-weight:700;font-size:24px;letter-spacing:.06em;text-shadow:0 0 14px rgba(255,245,238,.22);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .sub{font-size:11px;letter-spacing:.12em;color:var(--niebla);opacity:.75;margin-top:6px;text-transform:uppercase}
.frow .st{text-align:right}
.frow .st b{display:block;font-size:24px;letter-spacing:.06em;font-weight:700;text-shadow:0 0 14px currentColor}
.frow .st small{display:block;white-space:nowrap;font-size:11px;letter-spacing:.12em;color:var(--niebla);opacity:.75;margin-top:6px;text-transform:uppercase}
.st-libre{color:var(--board-ink)} .st-pronto{color:var(--amber)} .st-uso{color:var(--accent)}
.frow .act{justify-self:end;font-family:var(--f-sans)}
.frow.yours .code::before{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-top:14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}
.legend .hint{color:var(--amber)}
.flap{display:inline}
.flap span{display:inline-block;min-width:.6em;text-align:center}
.flap span.sp{min-width:.5em}

/* Salas */
.filters{margin-bottom:40px}
.rooms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.room{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface);display:flex;flex-direction:column;transition:border-color .2s,transform .25s}
.room:hover{border-color:var(--ink-subtle);transform:translateY(-2px)}
.room-img{position:relative;height:232px;background:var(--surface-alt);overflow:hidden;cursor:pointer}
.room-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.room:hover .room-img img{transform:scale(1.04)}
.badge{position:absolute;left:16px;bottom:16px;display:inline-flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border-radius:var(--pill);padding:5px 14px 5px 6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em}
.badge .em{width:26px;height:26px}
.em svg{width:100%;height:100%;display:block}
.room-body{padding:22px 24px 24px;display:grid;gap:10px;flex:1}
.room-body .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.room-body h3{margin:0;font-weight:500;font-size:22px;letter-spacing:-.02em}
.room-body .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.status{font-weight:600;font-size:17px;letter-spacing:-.01em}
.status.now{color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:var(--r-md);padding:48px;text-align:center;display:grid;gap:12px;justify-items:center}

/* Detalle */
.detail{display:grid;grid-template-columns:minmax(0,840px) minmax(0,440px);gap:48px;justify-content:space-between;align-items:start}
.back{margin-bottom:24px}
.gallery{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:16px;height:420px}
.gallery .main{border-radius:var(--r-sm);overflow:hidden;background:var(--surface-alt)}
.gallery .main img,.gallery .side img{width:100%;height:100%;object-fit:cover}
.gallery .sides{display:grid;grid-template-rows:1fr 1fr;gap:16px}
.gallery .side{border-radius:var(--r-sm);overflow:hidden;padding:0;position:relative;background:var(--surface-alt)}
.gallery .side::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s}
.gallery .side:hover::after{box-shadow:inset 0 0 0 2px var(--accent)}
.fade-in{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:.4}to{opacity:1}}
.d-intro{display:grid;gap:12px;margin:40px 0 28px}
.d-intro .h-xl{margin:4px 0}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:32px 0 48px}
.spec{background:var(--surface-alt);border-radius:var(--r-sm);padding:16px;display:grid;gap:6px}
.spec small{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-muted)}
.iso{position:relative;border:1px dashed var(--ink-subtle);border-radius:var(--r-sm);height:320px;overflow:hidden;margin-top:16px;background:var(--surface-alt)}
.iso img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:30% 40%}
:root[data-theme="dark"] .iso img{opacity:.55}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .iso img{opacity:.55}}
.iso::before,.iso::after{content:"";position:absolute;left:0;right:0;z-index:1;pointer-events:none}
.iso::before{top:0;height:64px;background:linear-gradient(var(--surface-alt),transparent)}
.iso::after{bottom:0;height:150px;background:linear-gradient(transparent,var(--surface-alt) 75%)}
.iso .lbl{position:absolute;left:16px;top:14px;z-index:2;font-size:12px;color:var(--ink-muted)}
.iso .bottom{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;display:grid;gap:10px}
.iso .pin{position:absolute;z-index:2;width:14px;height:14px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);box-shadow:0 0 0 6px rgba(229,92,65,.25)}
.iso .pin::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}
.plan-chip{height:40px;min-width:52px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--ink-muted)}
.plan-chip:hover{border-color:var(--ink-subtle);color:var(--ink)}
.plan-chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff5ee}
.panel{border:1px solid var(--line);border-radius:var(--r-md);padding:32px;display:grid;gap:28px;background:var(--surface);position:sticky;top:108px}
.group{display:grid;gap:12px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.group-h h3{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em}
.group-h small{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--ink-muted)}
.price-row{display:flex;justify-content:space-between;align-items:end;gap:12px}
.price-row .big{font-size:24px;font-weight:600;letter-spacing:-.02em}
.option{border:1px solid var(--line);border-radius:var(--r-sm);padding:18px 20px;display:grid;grid-template-columns:20px 1fr;gap:4px 14px;text-align:left;transition:border-color .2s}
.option:hover{border-color:var(--ink-subtle)}
.option[aria-checked="true"]{border:2px solid var(--ink);padding:17px 19px}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink-subtle);grid-row:span 2;margin-top:1px;position:relative}
[aria-checked="true"]>.radio{border:6px solid var(--ink)}
.option b{font-weight:500;font-size:16px}
.option b.mono{font-family:var(--f-mono);font-size:14px;letter-spacing:.04em}
.option span.d{font-size:13px;color:var(--ink-muted)}

/* Producto */
.product{display:grid;grid-template-columns:minmax(0,704px) minmax(0,560px);gap:64px;justify-content:space-between;align-items:start}
.product .ph{border-radius:var(--r-sm);overflow:hidden;aspect-ratio:1.1;background:var(--surface-alt);position:sticky;top:108px;max-width:100%}
.product .ph img{width:100%;height:100%;object-fit:cover}
.stepper{display:inline-flex;align-items:center;height:40px;border:1px solid var(--line);border-radius:var(--pill);padding:0 6px}
.stepper button{width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;display:grid;place-items:center}
.stepper button:hover{background:var(--surface-alt)}
.stepper button[disabled]{opacity:.3;cursor:not-allowed}
.stepper output{min-width:24px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.field{display:grid;gap:8px}
.field label{font-size:13px;color:var(--ink-muted)}
.input{height:52px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--field);padding:0 16px;font-size:15px;width:100%;transition:border-color .2s}
.input::placeholder{color:var(--ink-subtle)}
.input:focus{outline:none;border-color:var(--ink)}
.input.err{border-color:var(--accent)}
.err-msg{font-size:12px;color:var(--accent)}
.cta-row{display:flex;gap:16px;align-items:center}
.cta-row .btn-primary{flex:1}

/* Checkout */
.co{display:grid;grid-template-columns:minmax(0,824px) minmax(0,440px);gap:64px;justify-content:space-between;align-items:start}
.co section+section{margin-top:48px}
.cafe-grid{grid-template-columns:minmax(0,812px) minmax(0,426px)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.thumb{width:64px;height:64px;border-radius:6px;overflow:hidden;background:var(--surface-alt)}
.thumb img{width:100%;height:100%;object-fit:cover}
.line .t{font-weight:500;font-size:17px;letter-spacing:-.01em}
.line .data{margin-top:4px}
.line .r{text-align:right;display:grid;gap:4px;justify-items:end}
.line .r b{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.line .r .acts{display:flex;gap:12px}
.summary{background:var(--surface-alt);border-radius:var(--r-md);padding:32px;display:grid;gap:0;position:sticky;top:108px}
.summary h2{margin:0 0 20px}
.srow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.srow.total{border-top:1px solid var(--line);margin-top:12px;padding-top:22px;color:var(--ink);align-items:baseline}
.srow.total span{font-weight:500;font-size:17px}
.srow.total b{font-size:24px;font-weight:600;letter-spacing:-.02em}
.summary .note{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--ink-muted);margin:14px 0 16px;line-height:1.6}
.steps{display:flex;gap:20px;font-size:13px;color:var(--ink-subtle);margin-bottom:6px}
.steps b{color:var(--ink);font-weight:500}

/* Pago */
.pay-opts{display:grid;gap:12px}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:28px}
.card-grid .full{grid-column:1/-1}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,245,238,.35);border-top-color:#fff5ee;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Listo y reservas */
.ticket{background:var(--accent);color:#fff5ee;border-radius:var(--r-lg);padding:32px;display:grid;gap:8px;margin-top:32px;position:relative;overflow:hidden}
.ticket .h-xl{color:#fff5ee}
.ticket .code-box{margin:16px 0 8px}
.ticket .row{display:flex;gap:12px;flex-wrap:wrap}
.res{display:grid;grid-template-columns:minmax(0,440px) minmax(0,824px);gap:64px;justify-content:space-between;align-items:start}
.res .ticket{margin-top:0;position:sticky;top:108px}
.inline-note{font-size:12px;opacity:.85}

/* Modal (onboarding) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:24px;animation:fadeIn .2s ease;backdrop-filter:blur(2px)}
.sheet{background:var(--surface);color:var(--ink);border-radius:var(--r-lg);width:min(100%,560px);max-height:calc(100dvh - 48px);overflow:auto;padding:40px;box-shadow:var(--shadow);display:grid;gap:20px;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
:root[data-theme="dark"] .sheet{background:var(--surface-alt);border:1px solid var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sheet{background:var(--surface-alt);border:1px solid var(--line)}}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0}
.sheet .lead{margin:-8px 0 0;color:var(--ink-muted)}
.mini{background:var(--surface-alt);border-radius:var(--r-sm);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:16px}
:root[data-theme="dark"] .mini{background:var(--surface)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mini{background:var(--surface)}}
.mini b{font-weight:500}
.otp{display:flex;gap:10px}
.otp input{width:52px;height:56px;text-align:center;font-size:20px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--field)}
.otp input:focus{outline:none;border-color:var(--ink)}
.check{display:flex;gap:12px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.demo-hint{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--ink-subtle)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--surface-strong);color:var(--on-dark);border-radius:var(--pill);padding:12px 12px 12px 20px;display:flex;align-items:center;gap:16px;font-size:14px;box-shadow:var(--shadow);animation:rise .25s ease;max-width:calc(100vw - 32px)}
.toast button{color:var(--amber);font-weight:600;font-size:13px;padding:6px 10px;border-radius:var(--pill)}

/* ===== Responsive ===== */
@media (max-width:1180px){
  .rooms{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home{grid-template-columns:1fr;gap:40px}
  .detail,.co,.cafe-grid,.product,.res{grid-template-columns:1fr;gap:40px}
  .panel,.summary,.product .ph,.res .ticket{position:static}
  .dep{margin-top:32px}
}
@media (max-width:760px){
  :root{--gut:20px}
  body{font-size:15px}
  .nav{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
  .topbar .logo{height:18px}
  .topbar .right{display:flex;gap:8px;align-items:center}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:10px max(8px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{display:grid;justify-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-subtle);position:relative;padding-top:2px;transition:color .2s}
  .tabbar .ti{width:26px;height:26px;display:block}
  .tabbar .ti svg{width:100%;height:100%;display:block}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar button[aria-current="page"] .ti{color:var(--accent)}
  .tabbar button::before{content:"";position:absolute;top:-10px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .25s}
  .tabbar button[aria-current="page"]::before{transform:scale(1)}
  .has-tabbar main.page{padding-bottom:120px}
  .has-mbar main.page{padding-bottom:140px}
  .has-mbar .tabbar{display:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-top:1px solid var(--line);padding:14px max(20px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));justify-content:space-between;align-items:center;gap:16px}
  .mbar .data{margin:0}
  .mbar b{font-size:22px;font-weight:600;letter-spacing:-.02em}
  main.page{padding-block:16px 96px}
  .page-head{margin-bottom:24px}
  .clock{font-size:clamp(72px,24vw,104px);margin:4px 0 12px}
  .clock-sub{font-size:11px;letter-spacing:.1em}
  .dep{margin-top:28px;padding:24px}
  .dep h2{font-size:44px;margin:10px 0 12px}
  .dep p{margin-bottom:20px;font-size:15px}
  .board{padding:18px 12px 16px;border-radius:14px}
  .board-cols{display:none}
  .board-head .long{display:none}
  .board-head .short{display:inline}
  .frow{grid-template-columns:minmax(0,1fr) auto;min-height:0;padding:12px 4px 12px 12px;row-gap:6px;background:linear-gradient(to bottom,transparent calc(50% - .5px),var(--board-rule) calc(50% - .5px),var(--board-rule) calc(50% + .5px),transparent calc(50% + .5px)),repeating-linear-gradient(90deg,transparent 0 39px,var(--board-rule) 39px 40px)}
  .frow .code{display:none}
  .frow .name em.mcode{display:inline}
  .frow .name{font-size:17px}
  .frow .name em{font-style:normal;color:var(--amber);margin-right:10px}
  .frow .meter{grid-column:1}
  .frow .st{display:none}
  .frow .mst{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .frow .mst b{font-size:12px;font-weight:700;margin-right:8px}
  .frow .act{grid-row:1/span 4;grid-column:2;align-self:center}
  .frow.yours .code::before{display:none}
  .legend{font-size:10px}
  .rooms{grid-template-columns:1fr;gap:12px}
  .room{flex-direction:row;align-items:center;padding:12px;gap:14px}
  .room:hover{transform:none}
  .room-img{width:96px;height:64px;border-radius:6px;flex:none}
  .room-img .badge{display:none}
  .room-body{padding:0;gap:2px}
  .room-body .top{display:block}
  .room-body .top .data{display:block;margin-top:2px}
  .room-body h3{font-size:18px}
  .room-body .desc{display:none}
  .room-body .mcode{display:block}
  .room-body .foot{margin-top:2px}
  .room-body .foot .btn{display:none}
  .room .mobile-act{display:inline-flex}
  .status{font-size:13px;font-weight:500}
  .gallery{grid-template-columns:1fr;height:auto;margin-left:calc(-1*var(--gut));margin-right:calc(-1*var(--gut))}
  .gallery .main{border-radius:0;aspect-ratio:3/2}
  .gallery .sides{display:none}
  .gdots{display:flex}
  .d-intro{margin:24px 0 16px}
  .specs{grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 32px}
  .iso{height:380px}
  .panel{padding:0;border:0;gap:24px}
  .panel>.h-m,.panel .price-row,.panel>.btn-primary{display:none}
  .co .summary{padding:24px}
  .sheet{padding:28px 22px;align-self:end;border-radius:20px 20px 0 0;max-height:92dvh}
  .scrim{padding:0;place-items:end stretch}
  .otp{gap:6px}.otp input{width:44px;height:52px}
  .card-grid{grid-template-columns:1fr}
  .ticket{padding:24px}
  .meta{display:none}
}
.gdots{display:none;justify-content:center;gap:8px;margin-top:12px}
.gdots button{width:8px;height:8px;border-radius:50%;background:var(--line)}
.gdots button[aria-current="true"]{background:var(--ink)}
.mobile-act,.mcode,.mst{display:none}
.room-body .mcode{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--amber)}
:root:not([data-theme="dark"]) .room-body .mcode{color:var(--accent)}
:root[data-theme="dark"] .room-body .mcode{color:var(--amber)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .room-body .mcode{color:var(--amber)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<canvas id="dots" aria-hidden="true"></canvas>
<div id="root"></div>
